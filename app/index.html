<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>車帳本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 車帳本 design system — iOS 27 Liquid Glass.
   Layout: floating glass controls over inset grouped lists; one-column phone layout, max 600px.
   Order: tokens → base → layout → glass surfaces → components → screens → motion. Every color, size,
   radius, space, shadow and duration below comes from a token; hard values appear only inside tokens. */

/* ───────── 1. Tokens ───────── */
:root{
  /* surfaces */
  --bg:#F2F2F7; --card:#FFFFFF; --card-elevated:#FFFFFF; --fill:rgba(120,120,128,.14); --sel:rgba(118,118,128,.15); --sep:rgba(60,60,67,.18);
  --scrim:rgba(0,0,0,.22); --knob:#FFFFFF;
  /* text — label2 raised from .6 to .75 so 13–15px text meets WCAG AA (4.5:1) on cards and on the page */
  --label:#000000; --label2:rgba(60,60,67,.75); --label3:rgba(60,60,67,.3);
  /* accent (user-selectable; JS overrides --blue and --blue-text) */
  --blue:#007AFF; --blue-text:#0069DB; --blue-strong:#0069DB; --on:#FFFFFF;
  /* filled buttons that carry words use the -strong shade so white text stays ≥4.5:1 */
  --red-strong:#D70015;
  /* system colors: fill shades for icons, bars and charts; -text shades for words (≥4.5:1) */
  --sysblue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --teal:#30B0C7; --indigo:#5856D6; --gray:#8E8E93;
  --green-text:#1F7D37; --orange-text:#A85800; --red-text:#D70015;
  /* Liquid Glass */
  --glass-a:.61; --glass:rgba(250,250,252,var(--glass-a)); --glass-hi:rgba(255,255,255,.95); --glass-edge:rgba(0,0,0,.13);
  --glass-drop:0 8px 28px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.06);
  --sheet:rgba(242,242,247,.9); --sheet-solid:#F2F2F7; --edge:rgba(242,242,247,.72);
  --tint-glow:color-mix(in srgb,var(--blue) 32%,transparent);
  --tint-soft:color-mix(in srgb,var(--blue) 14%,transparent);
  /* photo viewer is always dark */
  --viewer-bg:#000000; --viewer-fg:#FFFFFF; --viewer-dim:rgba(255,255,255,.75); --viewer-link:#0A84FF; --viewer-danger:#FF453A;

  /* typography — iOS Dynamic Type default sizes */
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;
  --fs-display:clamp(28px,8.4vw,44px); --fs-large:34px; --fs-title1:28px; --fs-title2:22px; --fs-title3:20px;
  --fs-body:17px; --fs-callout:16px; --fs-subhead:15px; --fs-footnote:13px; --fs-caption1:12px; --fs-caption2:11px; --fs-tab:10px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;

  /* spacing — 4pt grid */
  --sp-0:2px; --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));

  /* radius */
  --r-sm:8px; --r-md:12px; --r-lg:22px; --r-xl:26px; --r-sheet:36px; --r-pill:999px; --r-icon:23%;

  /* elevation */
  --sh-glass:inset 0 1px 1px var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.12),0 0 0 .5px var(--glass-edge),var(--glass-drop);
  --sh-tint:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 1px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.15),0 4px 14px var(--tint-glow);
  --sh-knob:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.18);
  --sh-sheet:inset 0 1px 1px var(--glass-hi),0 0 0 .5px var(--glass-edge),0 24px 60px rgba(0,0,0,.28);

  /* motion */
  --ease:cubic-bezier(.2,.9,.3,1); --t-press:.12s; --t-fast:.2s; --t-slow:.3s;

  /* sizes */
  --hit:44px; --icon:30px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card-elevated:#2C2C2E; --fill:rgba(120,120,128,.28); --sel:rgba(255,255,255,.13); --sep:rgba(84,84,88,.55);
  --scrim:rgba(0,0,0,.45);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --blue:#0A84FF; --blue-text:#0A84FF;
  --sysblue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --teal:#40C8E0; --indigo:#5E5CE6;
  --green-text:#30D158; --orange-text:#FF9F0A; --red-text:#FF6961;
  --glass:rgba(44,44,48,var(--glass-a)); --glass-hi:rgba(255,255,255,.26); --glass-edge:rgba(0,0,0,.65);
  --glass-drop:0 8px 28px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.3);
  --sheet:rgba(28,28,30,.88); --sheet-solid:#1C1C1E; --edge:rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card-elevated:#2C2C2E; --fill:rgba(120,120,128,.28); --sel:rgba(255,255,255,.13); --sep:rgba(84,84,88,.55);
  --scrim:rgba(0,0,0,.45);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --blue:#0A84FF; --blue-text:#0A84FF;
  --sysblue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --teal:#40C8E0; --indigo:#5E5CE6;
  --green-text:#30D158; --orange-text:#FF9F0A; --red-text:#FF6961;
  --glass:rgba(44,44,48,var(--glass-a)); --glass-hi:rgba(255,255,255,.26); --glass-edge:rgba(0,0,0,.65);
  --glass-drop:0 8px 28px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.3);
  --sheet:rgba(28,28,30,.88); --sheet-solid:#1C1C1E; --edge:rgba(0,0,0,.6);
  color-scheme:dark }

/* ───────── 2. Base ───────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--label);font-family:var(--f);font-size:var(--fs-body);line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
svg.g{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer,.frow > .spacer{flex:1}
.accent{color:var(--blue-text)}
.ok-text{color:var(--green-text)}
.warn-text{color:var(--orange-text)}
.muted{color:var(--label2)}

/* ───────── 3. Layout ───────── */
.app{max-width:600px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
main{padding-block:var(--sp-1) var(--sp-4);padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;flex-direction:column;gap:var(--sp-6)}
h1{font-size:var(--fs-large);font-weight:var(--fw-bold);letter-spacing:.01em;margin:var(--sp-2) 0 calc(-1 * var(--sp-2));line-height:1.15}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:0 var(--sp-1) var(--sp-2)}
.sh h2{font-size:var(--fs-title3);font-weight:var(--fw-bold);margin:0;letter-spacing:.01em}
.sh button{color:var(--blue-text);font-size:var(--fs-subhead);min-height:var(--hit);margin-block:calc((24px - var(--hit)) / 2)}
.sh span{color:var(--label2);font-size:var(--fs-subhead)}
.foot,.ghead,.mhead{font-size:var(--fs-footnote);color:var(--label2);margin:var(--sp-2) var(--sp-4) 0;line-height:1.4}
.ghead,.mhead{margin:0 var(--sp-4) var(--sp-2)}
.mhead{display:flex;justify-content:space-between;align-items:baseline}
.mhead span:first-child{font-weight:var(--fw-semibold);color:var(--label)}
.months{display:flex;flex-direction:column;gap:var(--sp-4)}

/* top: floating glass buttons with a scroll-edge fade instead of a bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:60px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.nav::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * env(safe-area-inset-top,0px));bottom:-22px;z-index:-1;pointer-events:none;background:var(--edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);opacity:0;transition:opacity var(--t-fast)}
.nav.lifted::before{opacity:1}
.nav-title{position:absolute;left:50%;transform:translate(-50%,4px);font-size:var(--fs-body);font-weight:var(--fw-semibold);opacity:0;pointer-events:none;transition:opacity var(--t-fast),transform var(--t-fast);white-space:nowrap}
.nav.scrolled .nav-title{opacity:1;transform:translate(-50%,0)}

/* bottom: floating glass tab bar with the prominent add button in the middle */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tabs::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% + 26px);z-index:-1;background:var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(transparent,#000 65%);mask-image:linear-gradient(transparent,#000 65%)}
.tabs .in{pointer-events:auto;max-width:430px;height:66px;margin:0 auto;border-radius:var(--r-pill);padding:5px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:var(--sp-0);transition:height var(--t-slow) var(--ease)}
.tabs button[data-tab]{height:56px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-0);font-size:var(--fs-tab);font-weight:var(--fw-semibold);color:var(--label);transition:background var(--t-fast),color var(--t-fast),height var(--t-slow)}
.tabs button[data-tab][aria-current="page"]{background:var(--sel);color:var(--blue-text)}
.tabs button[data-tab] svg{width:25px;height:25px;stroke-width:1.8}
.tabs.mini .in{height:54px}
.tabs.mini button[data-tab]{height:var(--hit)}
.tabs.mini button[data-tab] span{display:none}
.fab-wrap{display:flex;justify-content:center;padding:0 6px}
.fab{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--on);box-shadow:var(--sh-tint);transition:width var(--t-slow),height var(--t-slow),transform var(--t-press)}
.fab svg{width:26px;height:26px;stroke-width:2.6}
.fab:active{transform:scale(.94)}
.tabs.mini .fab{width:var(--hit);height:var(--hit)}

/* ───────── 4. Glass surfaces ───────── */
.glass,.nav-btn,.car-pill,.tabs .in,.fchip,.toast,.gbtn:not(.tint){background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%);box-shadow:var(--sh-glass)}

/* ───────── 5. Buttons ───────── */
.nav-btn{width:var(--hit);height:var(--hit);border-radius:50%;display:grid;place-items:center;flex:none;color:var(--label)}
.nav-btn svg{width:21px;height:21px}
.car-pill{height:var(--hit);max-width:46%;min-width:0;display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-4) 6px 6px;border-radius:var(--r-pill);font-size:var(--fs-subhead);font-weight:var(--fw-semibold);transition:padding var(--t-fast)}
.car-pill .ic{width:32px;height:32px;border-radius:50%}
.car-pill .ic svg{width:16px;height:16px}
.car-pill > span:not(.ic){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-pill svg.dn{width:13px;height:13px;color:var(--label2);flex:none;stroke-width:2.8}
.nav.scrolled .car-pill{padding:6px}
.nav.scrolled .car-pill > span:not(.ic),.nav.scrolled .car-pill svg.dn{display:none}
.gbtn{width:var(--hit);height:var(--hit);border-radius:50%;display:grid;place-items:center;color:var(--label);font-size:var(--fs-callout)}
.gbtn svg{width:20px;height:20px;stroke-width:2.4}
.gbtn.text{width:auto;padding:0 var(--sp-4);border-radius:var(--r-pill);font-weight:var(--fw-semibold)}
.gbtn.tint{background:var(--blue);color:var(--on);box-shadow:var(--sh-tint)}
.gbtn.tint.text{background:var(--blue-strong)}
.info-btn{width:var(--hit);height:var(--hit);color:var(--blue-text);display:grid;place-items:center;flex:none}
.info-btn svg{width:22px;height:22px}
.rm{color:var(--red-text);font-size:var(--fs-subhead);flex:none;padding:var(--sp-2);margin:calc(-1 * var(--sp-2))}
.rm.on{text-decoration:line-through;color:var(--label2)}
.fchips{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:var(--sp-0) var(--sp-4)}
.fchips::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:var(--sp-2);flex:none;white-space:nowrap;padding:var(--sp-2) var(--sp-4);min-height:40px;border-radius:var(--r-pill);font-size:var(--fs-subhead)}
.fchip svg{width:17px;height:17px;color:var(--blue-text)}
.fchip b{font-weight:var(--fw-semibold);color:var(--label2)}
/* selected chip uses the same treatment as the selected tab: soft tint, accent text */
.fchip[aria-pressed="true"]{background:var(--tint-soft);color:var(--blue-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 35%,transparent)}
.fchip[aria-pressed="true"] b{color:var(--blue-text)}

/* ───────── 6. Lists ───────── */
.group{background:var(--card);border-radius:var(--r-xl);overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;padding:var(--sp-3) var(--sp-4);text-align:left;--inset:var(--sp-4)}
/* separators start where the text starts: padding + icon + gap */
.group.icons .cell{--inset:calc(var(--sp-4) + var(--icon) + var(--sp-3))}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset);border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
label.cell{cursor:pointer}
.cell .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-0)}
.cell .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t .sub{color:var(--label2);font-size:var(--fs-footnote)}
.cell .s{font-size:var(--fs-footnote);color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s.warn-text{color:var(--orange-text)}
.cell .end{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-0);flex:none}
.cell .end b{font-weight:var(--fw-medium)}
.cell .end small{font-size:var(--fs-footnote);color:var(--label2)}
.cell .end small.ok-text{color:var(--green-text)}
.chev{width:8px;height:14px;color:var(--label3);flex:none;stroke-width:2.4}
.ic{width:var(--icon);height:var(--icon);border-radius:var(--r-icon);display:grid;place-items:center;color:var(--on);flex:none;background:var(--c)}
.ic svg{width:18px;height:18px}
.check{width:20px;height:20px;color:var(--blue-text);flex:none;visibility:hidden;stroke-width:2.6}
.pickrow[aria-checked="true"] .check,.carrow.on .check{visibility:visible}
.carrow{display:flex;align-items:center;gap:var(--sp-2);padding-right:var(--sp-2)}
.carrow .pk{flex:1;display:flex;align-items:center;gap:var(--sp-3);min-width:0;text-align:left}
.add-row{color:var(--blue-text)}
.as-opt{justify-content:center;color:var(--blue-text);font-size:var(--fs-title3);min-height:57px}
.as-cancel{font-weight:var(--fw-semibold)}
.danger{justify-content:center;color:var(--red-text)}
.danger.arm{background:var(--red-strong);color:var(--on);font-weight:var(--fw-semibold)}
.soon-row,.soon-row .t{color:var(--label2)}
.pill-soon{font-size:var(--fs-caption1);font-weight:var(--fw-semibold);color:var(--label2);background:var(--fill);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-pill);flex:none}

/* reminder rows */
.rem .main{gap:var(--sp-2)}
.rem .top{display:flex;justify-content:space-between;gap:var(--sp-2);align-items:baseline}
.rem .top .t{font-size:var(--fs-body);color:var(--label)}
.rem .top span:not(.t){font-size:var(--fs-footnote);color:var(--label2);white-space:nowrap}
.track{height:6px;border-radius:var(--r-pill);background:var(--fill);overflow:hidden}
.track i{display:block;height:100%;border-radius:var(--r-pill);background:var(--c)}
.rem .left{font-size:var(--fs-footnote);font-weight:var(--fw-medium);color:var(--ct)}

/* ───────── 7. Form controls ───────── */
.frow{gap:var(--sp-3)}
.frow > span{flex:none}
.frow input:not([type=checkbox]){flex:1;min-width:0;text-align:right;border:0;background:transparent;padding:0;color:var(--label2);outline:none}
.frow input:focus{color:var(--label)}
.frow input::placeholder{color:var(--label3)}
.frow input:focus-visible{outline:none}
.frow:focus-within{box-shadow:inset 3px 0 0 var(--blue)}
.frow em{font-style:normal;color:var(--label2);font-size:var(--fs-subhead);flex:none}
.frow input[type=date],.frow input[type=time]{flex:none;background:var(--fill);color:var(--label);border:0;border-radius:var(--r-sm);padding:6px var(--sp-3);text-align:center;min-height:36px;outline:none}
.err{color:var(--red-text);font-size:var(--fs-footnote);margin:calc(-1 * var(--sp-3)) var(--sp-4) 0}
.err:empty{display:none}
.err.below{margin-top:var(--sp-1)}
/* switch: iOS 26/27 capsule knob */
.switch{appearance:none;-webkit-appearance:none;width:64px;height:28px;border-radius:14px;background:var(--fill);position:relative;flex:none;cursor:pointer;margin:0;transition:background var(--t-fast)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:12px;background:var(--knob);box-shadow:var(--sh-knob);transition:transform var(--t-fast)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(22px)}
/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-0);background:var(--fill);border-radius:var(--r-pill);padding:3px}
.seg button{font-size:var(--fs-footnote);font-weight:var(--fw-medium);border-radius:var(--r-pill);padding:var(--sp-2) 0;min-height:32px}
.seg button[aria-pressed="true"]{font-weight:var(--fw-semibold);background:var(--card);box-shadow:var(--sh-knob)}
.seg.inrow{flex:none;width:150px;margin-left:auto}
.seg.inrow.w-theme{width:170px}
.seg.inrow.wide{width:auto;flex:1;max-width:290px}
.seg.inrow.wide button{padding:var(--sp-2) var(--sp-0);white-space:nowrap}
/* slider */
input[type=range].lvl{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:var(--sp-1) 0 0}
.lvl::-webkit-slider-runnable-track{height:4px;border-radius:var(--r-pill);background:var(--fill)}
.lvl::-moz-range-track{height:4px;border-radius:var(--r-pill);background:var(--fill)}
.lvl::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:24px;border-radius:12px;margin-top:-10px;background:var(--knob);box-shadow:var(--sh-knob)}
.lvl::-moz-range-thumb{width:38px;height:24px;border-radius:12px;border:0;background:var(--knob);box-shadow:var(--sh-knob)}
/* compact number field used in interval editor */
.ivrow .main{flex-direction:row;align-items:center;gap:var(--sp-2)}
.ivin{display:flex;align-items:center;gap:var(--sp-1);background:var(--fill);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2);flex:none;min-height:32px}
.ivin input{width:50px;border:0;background:transparent;text-align:right;padding:0;outline:none;font-size:var(--fs-subhead)}
.ivin input.mo{width:24px}
.ivin em{font-style:normal;font-size:var(--fs-caption1);color:var(--label2)}
.ivin:focus-within{box-shadow:0 0 0 2px var(--blue)}
details.adv summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);color:var(--blue-text);font-size:var(--fs-subhead);cursor:pointer;min-height:var(--hit)}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary svg{width:15px;height:15px;transition:transform var(--t-fast)}
details.adv[open] summary svg{transform:rotate(180deg)}
details.adv .group{margin-top:var(--sp-2)}

/* ───────── 8. Cards and data ───────── */
.hero{background:var(--card);border-radius:var(--r-xl);overflow:hidden}
.gauge{position:relative;width:128px;height:128px}
.gauge svg{width:100%;height:100%}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:var(--sp-1)}
.gauge .v b{font-family:var(--f-round);font-size:var(--fs-large);font-weight:var(--fw-bold);line-height:1}
.gauge .v small{font-size:var(--fs-caption1);color:var(--label2);margin-top:var(--sp-1)}
.gauge .v svg{width:18px;height:18px;color:var(--green);margin-top:var(--sp-1)}
.odo{display:flex;flex-direction:column;min-width:0}
.odo b{white-space:nowrap;font-family:var(--f-round);font-size:var(--fs-display);font-weight:var(--fw-bold);line-height:1.05;letter-spacing:-.01em}
.odo b i{font-style:normal;font-size:var(--fs-subhead);font-weight:var(--fw-medium);color:var(--label2);margin-left:var(--sp-1);letter-spacing:0}
.odo .meta{font-size:var(--fs-subhead);color:var(--label2);margin-top:var(--sp-2)}
.odo-edit{display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--label2);font-size:var(--fs-subhead);align-self:flex-start;min-height:32px}
.odo-edit svg{width:14px;height:14px;color:var(--blue-text)}
/* stat tiles (3-up) and KPI cards (2-up) share one style */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.tile,.kpi{background:var(--card);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-0);min-width:0;text-align:left}
.tile small,.kpi small{font-size:var(--fs-footnote);color:var(--label2);white-space:nowrap}
.tile b,.kpi b{font-family:var(--f-round);font-size:var(--fs-title1);font-weight:var(--fw-bold);line-height:1.1;white-space:nowrap}
.tile b i,.kpi b i{font-style:normal;font-size:var(--fs-footnote);font-weight:var(--fw-medium);color:var(--label2);margin-left:var(--sp-0)}
.tile b.soon,.tile b.soon i{color:var(--orange-text)}
.tile b.due,.tile b.due i{color:var(--red-text)}
.tile b.none{color:var(--label3)}
.chart-card{background:var(--card);border-radius:var(--r-xl);padding:var(--sp-4) var(--sp-3) var(--sp-3)}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--label2);font-size:var(--fs-caption2);font-family:var(--f)}
.chart .grid{stroke:var(--sep);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-4);font-size:var(--fs-footnote);color:var(--label2);margin:var(--sp-2) var(--sp-1) 0}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c)}
.live{display:grid;grid-template-columns:1fr 1fr}
.live > div{padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-0);min-width:0}
.live > div:nth-child(n+3){border-top:.5px solid var(--sep)}
.live > div:nth-child(odd){border-right:.5px solid var(--sep)}
.live small{font-size:var(--fs-footnote);color:var(--label2)}
.live b{font-family:var(--f-round);font-size:var(--fs-title2);font-weight:var(--fw-bold);white-space:nowrap}
.live b i{font-style:normal;font-size:var(--fs-caption1);font-weight:var(--fw-medium);color:var(--label2);margin-left:var(--sp-1)}
.live-why{grid-column:1/-1;margin:0;padding:var(--sp-3) var(--sp-4);border-top:.5px solid var(--sep);font-size:var(--fs-footnote);color:var(--label2)}

/* ───────── 9. Feedback ───────── */
.empty{color:var(--label2);text-align:center;padding:var(--sp-6) var(--sp-5);font-size:var(--fs-subhead);line-height:1.5}
.notice{display:flex;align-items:center;gap:var(--sp-3)}
.notice .ic{background:var(--sysblue)}
.notice.alert .ic{background:var(--orange)}
.notice p{margin:0;flex:1;font-size:var(--fs-subhead);line-height:1.4;min-width:0}
.notice p b{font-weight:var(--fw-semibold)}
.notice button{color:var(--blue-text);font-size:var(--fs-subhead);white-space:nowrap;min-height:var(--hit)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;border-radius:var(--r-pill);color:var(--label);padding:var(--sp-3) var(--sp-5);font-size:var(--fs-subhead);max-width:calc(100% - 32px);text-align:center}
.about{text-align:center;color:var(--label2);font-size:var(--fs-footnote);margin:0}

/* ───────── 10. Sheets ───────── */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.scrim.top{z-index:30}
.sheet{width:calc(100% - 16px);max-width:600px;max-height:calc(100% - 52px);overflow:auto;margin:0 var(--sp-2) calc(8px + env(safe-area-inset-bottom,0px));padding-bottom:var(--sp-6);border-radius:var(--r-sheet);background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--sh-sheet)}
.grab{width:40px;height:5px;margin:var(--sp-2) auto 0;border-radius:var(--r-pill);background:var(--label3);opacity:.7}
.shead{position:sticky;top:0;z-index:2;height:66px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--sp-4);background:linear-gradient(var(--sheet-solid) 72%,transparent)}
.shead strong{font-size:var(--fs-body);font-weight:var(--fw-bold)}
.shead > :first-child{justify-self:start}
.shead > :last-child{justify-self:end}
.sbody{display:flex;flex-direction:column;gap:var(--sp-6);padding-block:var(--sp-2);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.sheet .group,.sheet .add-tile,.sheet .cat{background:var(--card-elevated)}
.sbody.top-pad{padding-top:var(--sp-5)}
.foot.lead{margin:0 var(--sp-1)}
.foot.tuck{margin-top:calc(-1 * var(--sp-4))}
.add-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-3)}
.add-head h3{font-size:var(--fs-title1);font-weight:var(--fw-bold);margin:0;letter-spacing:.01em}
.add-head p{margin:var(--sp-0) 0 0;color:var(--label2);font-size:var(--fs-subhead)}
.add-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3)}
.add-tile{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-5);min-width:0;padding:var(--sp-4);text-align:left;background:var(--card);border-radius:var(--r-lg);transition:transform var(--t-press)}
.add-tile .ic{width:40px;height:40px}
.add-tile .ic svg{width:23px;height:23px}
.add-tile b{font-size:var(--fs-body);display:block;font-weight:var(--fw-semibold)}
.add-tile small{font-size:var(--fs-footnote);color:var(--label2)}
.add-tile:active{transform:scale(.96)}

/* ───────── 11. Screen-specific ───────── */
/* fuel-gauge picker */
.gpick{padding:var(--sp-4) var(--sp-4) var(--sp-3);display:flex;flex-direction:column;align-items:center;gap:var(--sp-0)}
.gpick svg{width:220px;max-width:100%;height:auto}
.gpick .ax{fill:var(--label2);font-size:var(--fs-footnote);font-weight:var(--fw-semibold);font-family:var(--f)}
#fg-needle{transition:transform var(--t-fast) ease-out}
.gread{display:flex;flex-direction:column;align-items:center}
.gread b{font-family:var(--f-round);font-size:var(--fs-title1);font-weight:var(--fw-bold);line-height:1.1}
.gread small{font-size:var(--fs-footnote);color:var(--label2)}
/* photos */
.photos{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-3)}
.thumb{width:72px;height:72px;border-radius:var(--r-md);overflow:hidden;background:var(--fill);display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-0);color:var(--blue-text);font-size:var(--fs-caption1);cursor:pointer}
.thumb.add svg{width:22px;height:22px}
/* expense categories */
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2)}
.cat{background:var(--card);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-1) var(--sp-2);display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);font-size:var(--fs-footnote);border:2px solid transparent;min-width:0}
.cat[aria-checked="true"]{border-color:var(--blue);font-weight:var(--fw-semibold)}
/* part editor */
.part-hero{display:flex;justify-content:center;margin:calc(-1 * var(--sp-1)) 0 calc(-1 * var(--sp-2))}
.part-hero .ic{width:72px;height:72px}
.part-hero .ic svg{width:40px;height:40px}
/* settings */
.glassrow{flex-wrap:wrap}
.glass-sl{display:flex;align-items:center;gap:var(--sp-2);flex:1;min-width:180px;margin-left:auto}
.glass-sl small{font-size:var(--fs-caption1);color:var(--label2)}
.glass-sl .lvl{flex:1}
.dots{display:flex;justify-content:flex-end;gap:var(--sp-0);margin-left:auto;flex-wrap:nowrap}
/* 30px hit area, 22px swatch, ring when selected */
.dot{width:30px;height:30px;padding:4px;border-radius:50%;background:var(--dc);background-clip:content-box;flex:none}
.dot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--dc)}
/* photo viewer (always dark) */
.viewer{position:fixed;inset:0;z-index:40;background:var(--viewer-bg);color:var(--viewer-fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--hit);gap:var(--sp-2);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.vbar button{color:var(--viewer-link);font-size:var(--fs-body);justify-self:start;min-height:var(--hit)}
.vbar .vdel{justify-self:end;color:var(--viewer-danger)}
.vbar span{font-size:var(--fs-subhead);color:var(--viewer-dim);max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:var(--sp-3)}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vpdf{display:flex;flex-direction:column;align-items:center;gap:var(--sp-4);text-align:center;color:var(--viewer-dim);font-size:var(--fs-subhead)}
.vpdf svg{width:56px;height:56px;color:var(--viewer-fg)}
.vpdf a{color:var(--viewer-link);font-size:var(--fs-body)}
/* chart scrubbing (see design spec: Chart Inspector) */
.chart-wrap{position:relative;touch-action:pan-y;cursor:crosshair;outline:none}
.chart-wrap:focus-visible{box-shadow:0 0 0 2px var(--blue);border-radius:var(--r-md)}
.cursor-line{stroke:var(--label2);stroke-width:1;stroke-dasharray:3 3}
.ci{position:absolute;top:0;z-index:3;transform:translate(-50%,calc(-100% - var(--sp-2)));pointer-events:none;padding:6px var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-footnote);line-height:1.3;white-space:nowrap;text-align:center;opacity:0;transition:opacity var(--t-fast)}
.ci.on{opacity:1}
.ci b{display:block;font-family:var(--f-round);font-size:var(--fs-subhead);font-weight:var(--fw-bold)}
.ci small{color:var(--label2);font-size:var(--fs-caption1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chart .mark{transition:opacity var(--t-fast)}
.chart-hint{font-size:var(--fs-caption1);color:var(--label2);margin:var(--sp-1) var(--sp-1) 0}

/* ───────── 12. Motion ───────── */
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up var(--t-slow) var(--ease)}
  .scrim{animation:fade var(--t-fast) ease-out}
  @keyframes up{from{transform:translateY(40%)}to{transform:none}}
  @keyframes fade{from{background:transparent}}
}

/* ---------- 13. v21 additions: settings page, compact fuel form, car details ---------- */
.nav-sp{width:var(--hit);height:var(--hit);flex:none}
.settings{display:flex;flex-direction:column;gap:var(--sp-6)}
.cell.more{justify-content:center;min-height:var(--hit)}
.dt{color:var(--blue-text);font-weight:var(--fw-medium)}
.fchips.years{margin-bottom:var(--sp-4)}
.sbody.compact{gap:var(--sp-4)}
.sbody.compact .foot{margin-top:var(--sp-1)}
.fchips.st{margin:0 calc(-1 * var(--gutter-r)) var(--sp-2) calc(-1 * var(--gutter-l));padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.fchip.sm{min-height:36px;padding:var(--sp-1) var(--sp-3);font-size:var(--fs-subhead)}
.st-row .frow input{text-align:left;padding-left:var(--sp-2)}
.st-row .seg.inrow{margin-left:0;width:120px}
.dtrow{gap:var(--sp-2)}
.dtrow input[type=date],.dtrow input[type=time]{flex:1 1 0;min-width:0}
.dtrow input[type=date]{flex-grow:1.25}
.pc input::placeholder{font-size:var(--fs-subhead)!important;font-weight:var(--fw-regular)!important}
.pairs.sw .cell{gap:var(--sp-2)}.pairs.sw .switch{flex:none}.pairs.sw span{white-space:nowrap}
.pairs.sw .cell{padding-left:var(--sp-4);padding-right:var(--sp-3)}
.pairs.sw .cell:first-child{border-right:.5px solid var(--sep)}
.pairs.sw .cell::after{display:none}
.group.pairs{display:grid;grid-template-columns:1fr 1fr}
.group.pairs .tri{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:.5px solid var(--sep)}
.group.pairs .tri-pad{display:none}
.group.pairs .tri .pc{border-top:0!important;border-right:.5px solid var(--sep);padding-left:var(--sp-4);padding-right:var(--sp-3);grid-column:auto!important}
.group.pairs .tri .pc:last-child{border-right:0}
.tri .pc input{font-size:var(--fs-body);padding-right:2.4em}
.tri .pc em{right:var(--sp-3)}
.tri .pc.sel select{padding-right:14px;text-overflow:ellipsis}
.pc{display:flex;flex-direction:column;gap:var(--sp-0);padding:var(--sp-2) var(--sp-4);min-height:var(--hit);position:relative;cursor:text}
.pc:nth-child(odd){border-right:.5px solid var(--sep)}
.pc:nth-child(n+3){border-top:.5px solid var(--sep)}
.pc small{font-size:var(--fs-caption1);color:var(--label2)}
.pc input{border:0;background:transparent;padding:0 2.6em 0 0;font-size:var(--fs-title3);font-weight:var(--fw-semibold);color:var(--label);outline:none;min-width:0;width:100%}
.pc input::placeholder{color:var(--label3);font-weight:var(--fw-regular);font-size:var(--fs-body)}
.pc em{position:absolute;right:var(--sp-4);bottom:var(--sp-3);font-style:normal;font-size:var(--fs-caption1);color:var(--label2)}
.pc:focus-within{box-shadow:inset 3px 0 0 var(--blue)}
.live.three{grid-template-columns:repeat(3,1fr)}
.live.three > div{padding:var(--sp-2) var(--sp-3);border:0!important}
.live.three > div + div{border-left:.5px solid var(--sep)!important}
.live.three b{font-size:var(--fs-title3)}
.adv .group + div{margin-top:var(--sp-4)}
.title-row input{text-align:left!important;font-size:var(--fs-title3);font-weight:var(--fw-semibold);color:var(--label)!important}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-3);border-radius:var(--r-lg);background:var(--card-elevated,var(--card));color:var(--label2);font-size:var(--fs-subhead);font-weight:var(--fw-semibold);border:2px solid transparent;transition:border-color var(--t-fast),color var(--t-fast)}
.tcard svg{width:34px;height:34px}
.tcard[aria-pressed=true]{border-color:var(--blue);color:var(--blue-text)}
.frow select{border:0;background:var(--fill);color:var(--label);border-radius:var(--r-sm);padding:6px var(--sp-3);min-height:36px;font:inherit;font-size:var(--fs-subhead)}
.ro{font-weight:var(--fw-medium);color:var(--label2)}
.reset{color:var(--blue-text);font-size:var(--fs-subhead);padding:0 var(--sp-2);min-height:var(--hit)}
.slrow{flex-direction:column;align-items:stretch;gap:var(--sp-2)}
.sltop{display:flex;justify-content:space-between;align-items:baseline}
.sltop b{color:var(--blue-text)}
.slrow small{font-size:var(--fs-footnote);color:var(--label2)}

/* ---------- 14. v23: fuel grade colours (pump price-board colours), two-column fuel form, accent reach ---------- */
.ftag{display:inline-block;font-size:var(--fs-caption1);font-weight:var(--fw-semibold);line-height:1;padding:3px 6px;border-radius:6px;margin-left:var(--sp-2);vertical-align:2px;color:#fff;background:var(--fuel-95)}
.chart-title{margin:0 0 var(--sp-2);font-size:var(--fs-subhead);font-weight:var(--fw-semibold);color:var(--label2)}
section > .kpis{margin-bottom:var(--sp-3)}
section > .chart-card + .chart-card{margin-top:var(--sp-3)}
.year-sec{margin-top:var(--sp-6)}
.pc input[type=date],.pc input[type=time]{font-size:var(--fs-body);font-weight:var(--fw-medium);padding:0;-webkit-appearance:none;appearance:none;background:transparent;color:var(--label);min-height:28px}
.pc.sel select{border:0;background:transparent;padding:0;font:inherit;font-size:var(--fs-body);font-weight:var(--fw-semibold);color:var(--label);min-height:28px;width:100%;-webkit-appearance:none;appearance:none;outline:none;background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:18px}
.pc.sel select:disabled{color:var(--label3);background-image:none}
.pc.sel input{font-size:var(--fs-body);padding-right:0}
.pc.chk{flex-direction:row;align-items:center;gap:var(--sp-3);cursor:pointer;font-size:var(--fs-body)}
.pc.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--label3);margin:0;padding:0;display:grid;place-items:center;transition:background var(--t-fast),border-color var(--t-fast)}
.pc.chk input:checked{background:var(--blue);border-color:var(--blue)}
.pc.chk input:checked::after{content:"";width:10px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.pc.chk input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* accent reaches more of the app: page tint, switches, selected segments, dates, key numbers */
html,body{background:color-mix(in srgb,var(--blue) 7%,var(--bg))}
.switch:checked{background:var(--blue)}
.seg button[aria-pressed=true]{color:var(--blue-text)}
.kpi b,.hero .odo b{color:var(--blue-text)}
.kpi b i{color:var(--label2)}
.sh h2{color:var(--label)}
.sh button,.sh > span{color:var(--blue-text)}

/* ---------- 15. v24: spending mix, fuel grade tokens, form polish ---------- */
:root{--fuel-98:#1F7D37;--fuel-95:#8A6A00;--fuel-92:#8E3FB0;--fuel-diesel:#0A5FBF}
.ftag.f-98{background:var(--fuel-98)}.ftag.f-95{background:var(--fuel-95)}.ftag.f-92{background:var(--fuel-92)}.ftag.f-diesel{background:var(--fuel-diesel)}
.mix{padding-top:var(--sp-4)}
.mixbar{display:flex;gap:2px;height:14px;margin:0 var(--sp-4) var(--sp-2);border-radius:var(--r-pill);overflow:hidden;background:var(--fill)}
.mixbar i{display:block;height:100%}
.mixrow{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--hit)}
.mixrow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.mixrow .t{flex:1}
.mixrow .pct{color:var(--label2);font-size:var(--fs-subhead);min-width:3em;text-align:right}
.mixrow b{min-width:6.5em;text-align:right;font-weight:var(--fw-semibold)}
.subcats{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-4);padding-left:calc(var(--sp-4) + 10px + var(--sp-3));font-size:var(--fs-footnote);color:var(--label2)}
.subcats em{font-style:normal}.subcats b{color:var(--label);font-weight:var(--fw-medium)}
.pc.full{grid-column:1/-1;border-right:0!important}
.pc.full input{padding-right:0;font-size:var(--fs-body);font-weight:var(--fw-regular)}
.pc.chk:focus-within{box-shadow:none}
.pc.chk:has(input:focus-visible){box-shadow:inset 3px 0 0 var(--blue)}
.group.pairs .pc:nth-child(odd):last-child{grid-column:1/-1;border-right:0}

const OIL={st:'idle',series:{},meta:null,waits:[],
  load(){
    if(this.st==='loading'||this.st==='ok')return;
    this.st='loading';
    (async()=>{
      try{
        let s={},meta=null;
        if(window.OIL_CSV){({s,meta}=await oilFromCSV(window.OIL_CSV))}
        else{
          const db=window.claude?.use?await window.claude.use('db'):null;
          if(!db)throw new Error('no db');
          const snap=await db.collection('oil').get();
          for(const d of snap.docs){const x=d.data();if(d.id==='_meta')meta=x;else if(x&&Array.isArray(x.t)&&Array.isArray(x.p)&&x.t.length===x.p.length)s[d.id]=x}
        }

      }catch(e){this.st='fail'}

    })();
  },
  when(fn){if(this.st==='loading')this.waits.push(fn)},

  lookup(brand,ft,date,time){
    if(!ST[brand])return {why:'nobrand'};
    if(this.st!=='ok')return {why:this.st==='fail'?'fail':'loading'};
    const s=this.series[brand+'-'+ft];if(!s||!s.t.length)return {why:'nofuel'};
    const k=`${date} ${time||'23:59'}`;
    if(this.meta&&this.meta.validUntil&&k>=this.meta.validUntil)return {why:'stale'};
    let lo=0,hi=s.t.length-1,at=-1;while(lo<=hi){const m=(lo+hi)>>1;if(s.t[m]<=k){at=m;lo=m+1}else hi=m-1}

    return {price:+s.p[at],eff:s.t[at]};
  }
};
/* 網頁版：直接讀 GitHub 油價資料庫的 CSV（品牌,油品,每公升價格,生效時間,…） */
async function oilFromCSV(url){
  const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw new Error('csv');
  const txt=(await r.text()).replace(/^\ufeff/,'');
  const B={'中油':'cpc','台塑':'fpcc','好市多':'costco'},F={'92':'92','95':'95','98':'98','柴油':'diesel'},s={};let lastCpc='';
  for(const ln of txt.split(/\r?\n/).slice(1)){
    const c=ln.split(','),b=B[c[0]],f=F[c[1]],p=+c[2],t=c[3];
    if(!b||!f||!(p>0)||!/^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(t||''))continue;
    const k=b+'-'+f;(s[k]=s[k]||{brand:b,fuel:f,t:[],p:[]});s[k].t.push(t);s[k].p.push(p);
    if(b==='cpc'&&t>lastCpc)lastCpc=t;
  }
  for(const k in s){const z=s[k].t.map((t,i)=>[t,s[k].p[i]]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);s[k].t=z.map(x=>x[0]);s[k].p=z.map(x=>x[1])}
  let meta=null;
  if(lastCpc){const d=new Date(+lastCpc.slice(0,4),+lastCpc.slice(5,7)-1,+lastCpc.slice(8,10)+7);meta={validUntil:iso(d)+' 00:00'}}
  return {s,meta};
}

  sb:null,user:null,st:'idle',err:'',timer:null,busy:false,again:false,muted:false,limit:0,
  init(){
    const cf=window.SB_CONF;if(!cf||!window.supabase||!window.supabase.createClient)return;
    try{this.sb=window.supabase.createClient(cf.url,cf.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'chezhangben.auth'}})}catch(e){this.sb=null;return}
    this.sb.auth.onAuthStateChange((ev,ses)=>{
      const u=ses&&ses.user||null,was=this.user&&this.user.id;this.user=u;
      if(u&&u.id!==was)setTimeout(()=>this.onLogin(),0);
      if(!u){this.st='idle';this.err=''}
      if(tab==='settings')render();
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.kick(0)});
    window.addEventListener('online',()=>this.kick(0));
  },
  get on(){return !!(this.sb&&this.user)},
  meta(){
    const m=S.sync;
    if(!m||m.uid!==(this.user&&this.user.id))S.sync={uid:this.user&&this.user.id,last:null,base:{},files:{},localOnly:{},prefs:''};
    return S.sync;
  },
  quietSave(){this.muted=true;try{save()}finally{this.muted=false}},
  changed(){if(!this.muted&&this.on)this.kick(3000)},
  kick(ms){if(!this.on)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),ms)},
  async onLogin(){
    const m=this.meta();
    if(m.last){this.kick(0);return}
    // 第一次在這台裝置登入這個帳號
    if(S.sample||!S.cars.length){await this.run({adoptOnly:true});return}
    const n=S.cars.length,k=S.cars.reduce((a,c)=>a+Object.keys(SYNC_TBL).reduce((b,t)=>b+(c[t]||[]).length,0),0);
    open(head('上傳到帳號',null,'完成')+`<div class="settings">
      <p class="lead">這台裝置上有 ${n} 台車、${k} 筆紀錄。要上傳到帳號嗎？上傳後換手機、換電腦登入都看得到。</p>
      <div class="group"><button type="button" class="cell" id="up-yes">${ic('blue','upload')}<div class="main"><span class="t">上傳並同步</span><span class="s">帳號裡已經有的車會一起保留</span></div></button>
      <button type="button" class="cell" id="up-no">${ic('gray','car')}<div class="main"><span class="t">先不要</span><span class="s">這些車只留在這台裝置，只同步帳號裡的車</span></div></button></div></div>`,sc=>{
      sc.querySelector('#up-yes').addEventListener('click',()=>{close();this.run()});
      sc.querySelector('#up-no').addEventListener('click',()=>{const mm=this.meta();S.cars.forEach(c=>mm.localOnly[c.id]=1);this.quietSave();close();this.run()});
    });
  },
  rows(){
    const m=this.meta(),out={vehicles:[]};Object.values(SYNC_TBL).forEach(t=>out[t]=[]);
    for(const c of S.cars){
      if(m.localOnly[c.id])continue;
      const {fuel,charge,maint,exp,...car}=c;
      out.vehicles.push({key:'vehicles:'+c.id,row:{id:c.id,data:car}});
      for(const k in SYNC_TBL)for(const r of (c[k]||[])){
        if(!r.id)r.id=uid();
        const odo=r.odo===''||r.odo==null||!isFinite(+r.odo)?null:+r.odo;
        out[SYNC_TBL[k]].push({key:SYNC_TBL[k]+':'+c.id+':'+r.id,row:{id:r.id,vehicle_id:c.id,log_date:/^\d{4}-\d\d-\d\d$/.test(r.date||'')?r.date:null,odometer:odo,data:r}});
      }
    }
    return out;
  },
  async run(opt={}){
    if(!this.on)return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.st='busy';this.err='';this.paint();
    try{
      if(!opt.adoptOnly&&!S.sample)await this.push();
      await this.pull(opt.adoptOnly);
      if(!S.sample)await this.files();
      this.st='ok';this.meta().at=new Date().toISOString();
    }catch(e){
      this.st='err';
      const msg=String(e&&e.message||e);
      this.err=/fetch|network|Failed/i.test(msg)?'沒有網路，連上後會自動同步。':'同步失敗：'+msg.slice(0,120);
    }
    this.busy=false;this.quietSave();this.paint();
    if(this.again){this.again=false;this.kick(500)}
  },
  async push(){
    const m=this.meta(),R=this.rows(),now=new Date().toISOString(),sb=this.sb;
    this.limit=0;
    const blocked=new Set();
    // 車：一台一台送，才知道哪一台超過方案車數
    for(const {key,row} of R.vehicles){
      const h=hsh(row.data);if(m.base[key]===h)continue;
      const {error}=await sb.from('vehicles').upsert({...row,deleted_at:null},{onConflict:'id'});
      if(error){if(/VEHICLE_LIMIT:(\d+)/.test(error.message)){this.limit=+RegExp.$1;blocked.add(row.id);continue}throw error}
      m.base[key]=h;
    }
    for(const t of Object.values(SYNC_TBL)){
      const todo=R[t].filter(x=>!blocked.has(x.row.vehicle_id)&&m.base[x.key]!==hsh(x.row.data)&&(m.base['vehicles:'+x.row.vehicle_id]));
      for(let i=0;i<todo.length;i+=200){
        const part=todo.slice(i,i+200);
        const {error}=await sb.from(t).upsert(part.map(x=>({...x.row,deleted_at:null})),{onConflict:'vehicle_id,id'});
        if(error)throw error;
        part.forEach(x=>m.base[x.key]=hsh(x.row.data));
      }
    }
    // 本機刪掉的：雲端標記刪除
    const have=new Set();Object.values(R).forEach(a=>a.forEach(x=>have.add(x.key)));
    for(const key of Object.keys(m.base)){
      if(have.has(key))continue;
      const [t,a,b]=key.split(':');
      if(t==='prefs')continue;
      if(t!=='vehicles'&&m.localOnly[a])continue;
      let q=sb.from(t).update({deleted_at:now});
      q=t==='vehicles'?q.eq('id',a):q.eq('vehicle_id',a).eq('id',b);
      const {error}=await q;if(error)throw error;
      delete m.base[key];
    }
    // 偏好設定
    const p=S.prefs||{},ph=hsh(p);
    if(m.prefs!==ph){const {error}=await sb.from('profiles').update({prefs:p}).eq('id',this.user.id);if(!error)m.prefs=ph}
  },
  async fetchAll(t,since){
    const out=[];
    for(let from=0;;from+=1000){
      const {data,error}=await this.sb.from(t).select('*').gt('updated_at',since).order('updated_at').range(from,from+999);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  },
  async pull(adoptOnly){
    const m=this.meta();
    const since=m.last?new Date(Date.parse(m.last)-120000).toISOString():'1970-01-01T00:00:00Z';
    const V=await this.fetchAll('vehicles',since);
    const T={};for(const t of Object.values(SYNC_TBL))T[t]=await this.fetchAll(t,since);
    let maxT=m.last||'';const seen=ts=>{if(ts>maxT)maxT=ts};
    if(adoptOnly){
      // 範例資料或空白：雲端有車就整個換成雲端的
      const live=V.filter(v=>!v.deleted_at);
      if(!live.length){m.last=V.reduce((a,v)=>v.updated_at>a?v.updated_at:a,m.last||'')||null;return}
      DB.clear();const pr=S.prefs;S={cars:[],cur:null,sample:false,prefs:pr,sync:m};
    }
    let touched=false;
    for(const v of V){
      seen(v.updated_at);const key='vehicles:'+v.id;
      const i=S.cars.findIndex(c=>c.id===v.id);
      if(v.deleted_at){
        if(i>=0&&!m.localOnly[v.id]){dropCarFiles(S.cars[i]);S.cars.splice(i,1);touched=true}
        Object.keys(m.base).forEach(k=>{if(k===key||k.split(':')[1]===v.id)delete m.base[k]});
        continue;
      }
      const h=hsh(v.data);if(m.base[key]===h&&i>=0)continue;
      if(i>=0){const c=S.cars[i];S.cars[i]=norm({...v.data,fuel:c.fuel,charge:c.charge,maint:c.maint,exp:c.exp})}
      else S.cars.push(norm({...v.data,id:v.id,fuel:[],charge:[],maint:[],exp:[]}));
      m.base[key]=h;touched=true;
    }
    for(const k in SYNC_TBL){
      const t=SYNC_TBL[k];
      for(const r of T[t]){
        seen(r.updated_at);const key=t+':'+r.vehicle_id+':'+r.id;
        const c=S.cars.find(x=>x.id===r.vehicle_id);if(!c)continue;
        c[k]=c[k]||[];const i=c[k].findIndex(x=>x.id===r.id);
        if(r.deleted_at){if(i>=0){dropFiles(c[k][i].photos);c[k].splice(i,1);touched=true}delete m.base[key];continue}
        const h=hsh(r.data);if(m.base[key]===h&&i>=0)continue;
        const rec={...r.data,id:r.id};
        if(i>=0)c[k][i]=rec;else c[k].push(rec);
        m.base[key]=h;touched=true;
      }
    }
    // 偏好設定：雲端有、而且本機沒改過才套用
    try{
      const {data}=await this.sb.from('profiles').select('prefs').eq('id',this.user.id).maybeSingle();
      const sp=data&&data.prefs;
      if(sp&&Object.keys(sp).length){const sh=hsh(sp),lh=hsh(S.prefs||{});if(sh!==lh&&(m.prefs===lh||adoptOnly)){S.prefs=sp;m.prefs=sh;applyPrefs();touched=true}else if(sh===lh)m.prefs=sh}
    }catch(e){}
    if(maxT)m.last=maxT;
    if(!S.cars.length){const c=newCar();S.cars=[c];S.cur=c.id}
    if(!S.cars.some(c=>c.id===S.cur))S.cur=S.cars[0].id;
    if(touched){this.quietSave();if(!document.querySelector('.scrim'))render()}
  },
  /* 照片與車主手冊：路徑 <車輛編號>/<檔案編號> */
  async files(){
    const m=this.meta(),bk=this.sb.storage.from('photos');
    for(const c of S.cars){
      if(m.localOnly[c.id]||!m.base['vehicles:'+c.id])continue;
      const ids=[c.photo,...(c.docs||[]).map(d=>d.id)];
      for(const k in SYNC_TBL)(c[k]||[]).forEach(r=>ids.push(...(r.photos||[])));
      for(const id of ids){
        if(!id||m.files[id])continue;
        let v=null;try{v=await DB.get(id)}catch(e){}
        const path=c.id+'/'+id;
        if(v&&v.blob){
          const {error}=await bk.upload(path,v.blob,{upsert:true,contentType:v.blob.type||v.type||'image/jpeg'});
          if(!error)m.files[id]=1;
        }else{
          const {data,error}=await bk.download(path);
          if(!error&&data){await DB.put(id,{blob:data,name:'',type:data.type});m.files[id]=1;delete _purl[id]}
        }
      }
    }
  },
  async logout(){
    if(this.on){try{await this.run()}catch(e){}}
    try{await this.sb.auth.signOut()}catch(e){}
    this.user=null;DB.clear();const pr=S.prefs;S=sampleData();S.prefs=pr;save();render();
    toast('已登出，這台裝置上的資料已清除；紀錄都在雲端，下次登入會回來。');
  },
  statusText(){
    if(this.st==='busy')return '同步中…';
    if(this.st==='err')return this.err;
    const at=S.sync&&S.sync.at;if(!at)return '尚未同步';
    const d=new Date(at),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return (iso(d)===iso(today())?'今天 ':iso(d).replace(/-/g,'/')+' ')+t+' 已同步';
  },
  paint(){const el=document.getElementById('acct-st');if(el)el.textContent=this.statusText()},
  html(){
    if(!this.sb)return null;
    if(!this.user)return `<div><div class="group"><button type="button" class="cell" id="acct-login">${ic('blue','user')}<div class="main"><span class="t">登入或註冊</span><span class="s">用 Email 收登入信，不用記密碼</span></div>${chev}</button></div>
      <p class="foot">登入後紀錄會同步到雲端，換手機、換電腦都看得到。沒登入也能用，資料只存在這台裝置。</p></div>`;

      <div class="cell acct">${ic('blue','user')}<div class="main"><span class="t">${esc(this.user.email||'已登入')}</span><span class="s" id="acct-st">${esc(this.statusText())}</span></div></div>
      <button type="button" class="cell" id="acct-sync">${ic('green','sync')}<div class="main"><span class="t">立即同步</span></div></button>
      <button type="button" class="cell" id="acct-out">${ic('gray','user')}<div class="main"><span class="t">登出</span><span class="s">會清除這台裝置上的資料，雲端的不受影響</span></div></button>
    </div>${lim}${lo?`<p class="foot">有 ${lo} 台車設定成只留在這台裝置，不會同步。</p>`:''}</div>`;
  },
  bind(sc){
    const q=s=>sc.querySelector(s);
    q('#acct-login')&&q('#acct-login').addEventListener('click',()=>this.loginSheet());
    q('#acct-sync')&&q('#acct-sync').addEventListener('click',()=>this.run());
    const o=q('#acct-out');
    if(o)o.addEventListener('click',()=>{if(o.classList.contains('arm')){this.logout()}else{o.classList.add('arm');o.querySelector('.t').textContent='確定登出'}});
  },
  loginSheet(){
    let email='';
    const step1=()=>open(head('登入或註冊','lf','取消','下一步')+`<form id="lf" class="settings" novalidate>
      <div><p class="ghead">Email</p><div class="group"><label class="cell frow">${ic('blue','user')}<input id="lf-mail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Email" style="text-align:left" value="${esc(email)}"></label></div>
      <p class="err below" id="lf-err"></p><p class="foot">我們會寄一封登入信到這個信箱。第一次使用會自動建立帳號。</p></div></form>`,sc=>{
      const f=sc.querySelector('#lf'),inp=sc.querySelector('#lf-mail'),er=sc.querySelector('#lf-err');setTimeout(()=>inp.focus(),50);
      f.addEventListener('submit',async e=>{e.preventDefault();email=inp.value.trim();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){er.textContent='請填正確的 Email。';return}
        er.textContent='寄送中…';
        const {error}=await this.sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.href.split('#')[0]}});
        if(error){er.textContent=/rate|seconds/i.test(error.message)?'寄太多次了，請稍等一下再試。':'寄送失敗：'+error.message;return}
        step2()});
    });
    const step2=()=>open(head('收信登入','lc','返回','登入')+`<form id="lc" class="settings" novalidate>
      <div><p class="ghead">驗證碼</p><div class="group"><label class="cell frow">${ic('blue','lock')}<input id="lc-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="信裡的數字" aria-label="驗證碼" style="text-align:left;letter-spacing:.2em"></label></div>
      <p class="err below" id="lc-err"></p><p class="foot">已寄到 ${esc(email)}。請打開信裡的「Sign in」連結，就會回到車帳本並登入；信裡如果有數字驗證碼，也可以填在上面。沒收到請看垃圾郵件匣。</p></div></form>`,sc=>{
      const f=sc.querySelector('#lc'),inp=sc.querySelector('#lc-code'),er=sc.querySelector('#lc-err');setTimeout(()=>inp.focus(),50);
      sc.querySelector('[data-close]').addEventListener('click',()=>setTimeout(step1,0));
      f.addEventListener('submit',async e=>{e.preventDefault();const token=inp.value.replace(/\D/g,'');
        if(token.length<6){er.textContent='請輸入信裡的驗證碼。';return}
        er.textContent='登入中…';
        const {error}=await this.sb.auth.verifyOtp({email,token,type:'email'});
        if(error){er.textContent=/expired|invalid/i.test(error.message)?'驗證碼不對或已過期，請重新寄一次。':'登入失敗：'+error.message;return}
        close();toast('已登入');});
    });
    step1();
  }
};

const C=()=>S.cars.find(c=>c.id===S.cur)||S.cars[0];
const shortName=c=>c.nick||c.plate||c.model||c.name||'我的車';
const fullName=c=>[c.nick,c.brand,c.model,c.plate].filter(Boolean).join(' ')||c.name||'我的車';
const carModel=c=>[c.brand,c.model].filter(Boolean).join(' ')||c.name||'';
const carGlyph=c=>c.type==='scooter'?'scooter':'car';
const carColor=c=>c.type==='scooter'?'teal':'blue';

/* ---------- helpers ---------- */
const money=n=>'$'+Math.round(n).toLocaleString('zh-TW');
const fuelDec=()=>0; /* 加油金額一律整數（2026-11-18） */
const autoPrice=()=>!(S.prefs&&S.prefs.autoPrice===false);
const roundD=x=>{const k=10**fuelDec();return Math.round(x*k)/k};
const moneyF=n=>'$'+(+n||0).toLocaleString('zh-TW',{minimumFractionDigits:fuelDec(),maximumFractionDigits:fuelDec()});
const int=n=>Math.round(n).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addMonths(s,n){const d=parse(s);return new Date(d.getFullYear(),d.getMonth()+n,d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function md(s){const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`}
const lvlLabel=n=>n>=8?'滿':n<=0?'空':`${Math.round(n/8*100)}%`;

/* odometer swaps: records store the true total distance; the form shows what the meter reads */
function offsetAt(c,date){return (c.meterSwaps||[]).filter(s=>s.date<=date).reduce((a,s)=>a+(s.before-s.after),0)}
const toTrue=(c,date,reading)=>reading+offsetAt(c,date);
const toMeter=(c,date,odo)=>odo-offsetAt(c,date);

/* maintenance items for a car: presets (with per-car overrides) + custom */
function itemsFor(c){
  const sc=c.type==='scooter';
  const base=PRESETS.filter(p=>!(sc&&p.carOnly)).map(p=>{
    const def={km:sc&&p.s?p.s[0]:p.km,mo:sc&&p.s?p.s[1]:p.mo};const o=(c.intervals||{})[p.id];
    return {id:p.id,name:sc&&p.sname?p.sname:p.name,km:o?o.km:def.km,mo:o?o.mo:def.mo,def,c:p.c,g:p.g};
  });
  return base.concat((c.customItems||[]).map(x=>({...x,c:'gray',g:'wrench',custom:true})));
}
function itemOf(c,id){return itemsFor(c).find(i=>i.id===id)||(P[id]?{id,name:P[id].name,c:P[id].c,g:P[id].g}:null)}
function itemNames(m,c=C()){const a=(m.items||[]).map(id=>itemOf(c,id)?.name||'已移除項目');if(m.custom)a.push(m.custom);return a}

/* ---------- calc ---------- */
function allPoints(c){return [...c.fuel,...(c.charge||[]),...c.maint,...(c.odoLog||[])].filter(x=>x.odo>0).map(x=>({d:parse(x.date),o:+x.odo}))}
function currentOdo(c=C()){let m=+c.startOdo||0;for(const p of allPoints(c))m=Math.max(m,p.o);return m}
function lastRecordDate(c){let m=null;for(const p of allPoints(c))if(!m||p.d>m)m=p.d;return m}
function dailyKm(c=C()){
  const cut=addDays(today(),-120);const pts=allPoints(c).filter(p=>p.d>=cut).sort((a,b)=>a.d-b.d);
  if(pts.length<2)return null;
  const span=(pts[pts.length-1].d-pts[0].d)/864e5;const km=Math.max(...pts.map(p=>p.o))-Math.min(...pts.map(p=>p.o));
  return span>=7&&km>0?km/span:null;
}
/* gauge position → litres in the tank; E still holds the reserve (備用油) */
/* units: data is always stored in km, litres (kWh for EVs) and km/L; only the screen converts */
const MI=1.609344,GAL=3.785411784;
/* 插電油電車：充電紀錄放在 c.charge，用一個「電動車視角」重用加油的計算與表單 */
const isPhev=c=>c&&c.fuelKind==='phev'&&!c._real;
function evView(c){const u=c.units||{};return {...c,_real:c,fuel:c.charge||(c.charge=[]),fuelKind:'ev',tank:+c.battery||0,reserve:0,units:{dist:u.dist,econ:u.chEcon||'kmkwh'}}}
const energyRecs=c=>[...c.fuel,...(c.charge||[])];
function un(c=C()){const u=c.units||{},ev=c.fuelKind==='ev',phev=isPhev(c),mi=u.dist==='mi',gal=!ev&&u.vol==='gal';
  const ek=ev?(u.econ==='kwh100'?'kwh100':'kmkwh'):(['l100','mpg'].includes(u.econ)?u.econ:'kmpl');
  return {ev,phev,ch:!!c._real,mi,gal,ek,avgN:ev?'平均電耗':phev?'混合平均油耗':'平均油耗',

        const used=(1-L)*tank+(+f.liters||0);

      }else if(anchor&&known&&f.odo>anchor.odo)pending.push({id:f.id,km:f.odo-anchor.odo,date:f.date,fromId:anchor.id,kind:'whole'});

function fuelAlert(c=C()){

  const pts=Object.values(fuelCalc(c).per).filter(p=>!p.est).sort((a,b)=>a.date.localeCompare(b.date));

/* 定期驗車（自用小客車）：原發照 5 年內免驗，5–10 年每年一次，10 年以上每半年一次。
   營業用：5 年內每年一次，之後每半年一次。機車不用驗車，除非自己填日期。 */
function inspectSchedule(c){
  if(!c.deliveryDate||c.type==='scooter')return [];
  const D=c.deliveryDate,out=[],biz=c.usage==='biz';
  const at=m=>iso(addMonths(D,m));
  if(biz){for(let m=12;m<=60;m+=12)out.push(at(m));for(let m=66;m<=600;m+=6)out.push(at(m))}
  else{for(let m=60;m<120;m+=12)out.push(at(m));for(let m=120;m<=600;m+=6)out.push(at(m))}
  return out;
}
function inspectRuleText(c){
  if(c.type==='scooter')return '機車不用定期驗車';
  if(!c.deliveryDate)return '填原發照日期後自動計算';
  const age=(today()-parse(c.deliveryDate))/(365.25*864e5);
  if(c.usage==='biz')return age<5?'營業用：5 年內每年驗一次':'營業用：5 年以上每半年驗一次';
  return age<5?'出廠 5 年後開始每年驗車':age<10?'5–10 年：每年驗一次':'10 年以上：每半年驗一次';
}
function autoInspect(c,lastDone){
  /* the next scheduled date that has not been covered by an inspection (a month either side counts) */
  const floor=lastDone?iso(addDays(parse(lastDone),31)):iso(addDays(today(),-31));
  return inspectSchedule(c).find(s=>s>floor)||'';
}
function nextInspect(c){
  const done=c.maint.filter(m=>(m.items||[]).includes('inspect')).map(m=>m.date).sort().pop()||'';
  if(c.inspectDue&&(!done||c.inspectDue>iso(addDays(parse(done),31))))return {date:c.inspectDue,manual:true,done};
  return {date:autoInspect(c,done),manual:false,done};
}
function insAnchor(c){return c.insDue||c.deliveryDate||''}
function reminders(c=C()){
  const odo=currentOdo(c),now=today(),out=[],daily=dailyKm(c),lrd=lastRecordDate(c);
  const since=lrd?Math.max(0,Math.round((now-lrd)/864e5)):0;
  for(const it of itemsFor(c)){
    let recs=c.maint.filter(m=>(m.items||[]).includes(it.id));
    if(it.id==='insurance')recs=recs.concat((c.exp||[]).filter(e=>e.cat==='ins_c'||e.cat==='ins_o').map(e=>({date:e.date,odo:0,parts:{}})));
    recs.sort((a,b)=>b.date.localeCompare(a.date)||b.odo-a.odo);
    if(it.id==='inspect'){
      const ni=nextInspect(c);
      if(ni.date){
        const daysLeft=Math.round((parse(ni.date)-now)/864e5),span=c.usage==='biz'||(c.deliveryDate&&(now-parse(c.deliveryDate))/864e5>3652)?182:365;
        const st=daysLeft<0?'due':daysLeft<=45?'soon':'ok';

        continue;
      }
      if(c.deliveryDate||c.type==='scooter')continue;
    }
    if(it.id==='insurance'&&insAnchor(c)){
      /* insurance renews every year on the expiry date (default: the first registration date) */
      const dv=parse(insAnchor(c)),an=y=>new Date(y,dv.getMonth(),dv.getDate());
      let lastA=an(now.getFullYear());if(lastA>now)lastA=an(now.getFullYear()-1);const nextA=an(lastA.getFullYear()+1);
      const covered=lastA<=parse(c.deliveryDate||insAnchor(c))||recs.some(r=>{const d=parse(r.date);return d>=addDays(lastA,-60)&&d<=addDays(lastA,30)});
      const since=Math.round((now-lastA)/864e5);
      const daysLeft=!covered&&since<=60?-since:Math.round((nextA-now)/864e5);
      const st=daysLeft<0?'due':daysLeft<=45?'soon':'ok';
      out.push({it,iv:{km:0,mo:12},last:recs[0]||null,kmLeft:null,daysLeft,predDays:null,effDays:daysLeft,used:Math.min(Math.max(1-daysLeft/365,0),1),st,note:`每年 ${dv.getMonth()+1}/${dv.getDate()} 續保`});

    const iv={km:pk.km!=null?pk.km:it.km,mo:pk.mo!=null?pk.mo:it.mo};
    if(!iv.km&&!iv.mo)continue;
    let kmLeft=null,daysLeft=null,predDays=null,used=0;
    if(iv.km){kmLeft=last.odo+iv.km-odo;used=Math.max(used,(odo-last.odo)/iv.km);if(daily)predDays=Math.round(kmLeft/daily)-since}

  }

  for(const [cat,name,month] of [['lictax','牌照稅',5],['fueltax','燃料費',7]]){

  }
  const rank={due:0,soon:1,ok:2};

function inspector(root){
  root.querySelectorAll('.chart-wrap').forEach(w=>{
    const pts=JSON.parse(decodeURIComponent(w.dataset.points)),W=+w.dataset.w,line=w.querySelector('.cursor-line'),tip=w.querySelector('.ci'),sr=w.querySelector('.sr'),kind=w.dataset.kind;

      tip.innerHTML=`<small>${esc(p.title)}</small><b class="num">${esc(p.value)}</b>${p.lines.map(l=>`<small class="num">${esc(l)}</small>`).join('<br>')}`;
      const pct=p.x/W*100;tip.style.left=`clamp(70px, ${pct}%, calc(100% - 70px))`;tip.classList.add('on');

    w.addEventListener('pointermove',e=>{if(dragging||e.pointerType==='mouse')show(nearest(e))});

    w.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){e.preventDefault();show(cur<0?pts.length-1:Math.min(pts.length-1,cur+1))}

  </form>`,sc=>{

    function draft(){

function backfillSheet(c,cr){

  let ft=cr.fuelType||'95';

function bindDocs(sc,c){
  const box=sc.querySelector('#docs'),err=sc.querySelector('#doc-err');
  const redraw=()=>{box.innerHTML=docsList(c);bindDocs(sc,c)};
  box.querySelectorAll('[data-doc]').forEach(b=>b.addEventListener('click',async()=>{
    const d=c.docs.find(x=>x.id===b.dataset.doc);const v=await DB.get(d.id).catch(()=>null);
    if(!v){err.textContent='找不到這個檔案，可能已被瀏覽器清除。';return}
    const u=URL.createObjectURL(v.blob);
    const del=()=>{c.docs=c.docs.filter(x=>x.id!==d.id);DB.del(d.id);save();redraw()};
    if(d.type==='application/pdf')viewer(`<div class="vpdf">${svg('book')}<span>${esc(d.name)}</span><a href="${u}" target="_blank" rel="noopener">開啟 PDF</a></div>`,d.name,del);
    else viewer(`<img src="${u}" alt="${esc(d.name)}">`,d.name,del);
  }));
  sc.querySelector('#doc-in').onchange=async e=>{
    err.textContent='';
    for(const file of [...e.target.files]){
      try{
        const isPdf=file.type==='application/pdf';
        if(isPdf&&file.size>25*1024*1024)throw new Error(`「${file.name}」超過 25 MB`);
        const blob=isPdf?file:await compress(file);const id='doc_'+uid();
        await DB.put(id,{blob,name:file.name,type:isPdf?file.type:'image/jpeg'});
        c.docs=c.docs||[];c.docs.push({id,name:file.name,type:isPdf?file.type:'image/jpeg',size:blob.size,date:iso(today())});
      }catch(x){err.textContent='有檔案沒辦法加入：'+(x&&x.message||'這個瀏覽器不支援儲存檔案')+'。'}
    }
    save();redraw();
  };
}

  const pS=sh['品項價格'];

    const cn=t=>{t=String(t);if(/^\d+(\.\d+)?$/.test(t))return +t;const d={'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};return t.length===1?d[t]||0:t==='十'?10:t.startsWith('十')?10+(d[t[1]]||0):(d[t[0]]||0)*10+(d[t[2]]||0)};
    const cyc=v=>{const t=String(v??'').replace(/\s/g,'');if(!t)return null;let km=0,mo=0,m;
      if((m=t.match(/(\d+)\/(\d+)月/))){km=+m[1];mo=+m[2]}
      else{if((m=t.match(/(\d+)(公里|km)/i)))km=+m[1];if((m=t.match(/([\d一二兩三四五六七八九十]+)萬/)))km=cn(m[1])*10000;if((m=t.match(/(\d+)個?月/)))mo=+m[1];if((m=t.match(/([\d一二兩三四五六七八九十]+)年/)))mo=cn(m[1])*12;if(!km&&!mo&&/^\d+$/.test(t))km=+t}
      return km||mo?{km,mo}:null};
    for(const r of Object.keys(pS).map(Number).filter(r=>r>1).sort((a,b)=>a-b)){
      const name=String(pS[r][h['品項']]||'').trim(),iv=cyc(pS[r][h['保養週期']]);if(!name||!iv||done.has(name))continue;done.add(name);
      const nm=ITEM_ALIAS[name]||name;const pre=itemsFor(c).find(i=>!i.custom&&(i.name===nm||i.name===name));
      if(pre)c.intervals[pre.id]=iv;
      else{const ex=c.customItems.find(x=>x.name===name);if(ex)Object.assign(ex,iv);else c.customItems.push({id:'cx_'+uid(),name,...iv})}
    }}
  const oS=sh['其他費用'];
  if(oS){const h=headerMap(oS);const byName=Object.fromEntries(EXP.map(x=>[x.name,x.id]));
    for(const r of Object.keys(oS).map(Number).filter(r=>r>1)){const row=oS[r],date=serialToIso(row[h['日期']]),amt=numv(row[h['金額']]);if(!date||!amt)continue;
      c.exp.push({id:uid(),date,cat:byName[String(row[h['類別']]||'').trim()]||'other',amount:amt,note:String(row[h['備註']]||''),photos:[]})}}
  if(!c.fuel.length&&!c.maint.length&&!c.exp.length)throw new Error('這個 Excel 裡沒有讀到任何紀錄。');
  return c;
}
async function importExcel(file){
  let car;try{car=workbookToCar(await readWorkbook(file))}catch(e){toast(e&&e.message?e.message:'這個 Excel 讀不出來。');return}
  if(!S.sample&&S.cars.some(x=>x.name===car.name&&x.plate===car.plate))car.name+='（匯入）';
  if(S.sample){S.cars.forEach(dropCarFiles);S={cars:[car],cur:car.id,sample:false,prefs:S.prefs}}else{S.cars.push(car);S.cur=car.id}
  afterChange();toast(`已匯入 ${car.plate||car.name}：加油 ${car.fuel.length} 筆、保養 ${car.maint.length} 筆、費用 ${car.exp.length} 筆。`);
}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function dataURLToBlob(u){const [h,b64]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function exportBackup(cars){
  const ids=[];for(const c of cars){[...c.fuel,...c.maint,...(c.exp||[])].forEach(r=>(r.photos||[]).forEach(x=>ids.push(x)));(c.docs||[]).forEach(d=>ids.push(d.id));if(c.photo)ids.push(c.photo)}
  const files={};
  for(const id of ids){try{const v=await DB.get(id);if(v)files[id]={name:v.name,type:v.type,data:await blobToDataURL(v.blob)}}catch(e){}}
  const out={app:'車帳本',format:1,exported:new Date().toISOString(),cars,files};
  await offerFile(cars.length===1?`車帳本轉移檔-${cars[0].plate||cars[0].name}-${iso(today())}.json`:`車帳本備份-${iso(today())}.json`,JSON.stringify(out));
}
async function importBackup(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){toast('這個檔案打不開，請選擇車帳本匯出的 .json 檔。');return}
  if(!o||o.app!=='車帳本'||!Array.isArray(o.cars)||!o.cars.length){toast('這不是車帳本的備份或轉移檔。');return}
  for(const [id,f] of Object.entries(o.files||{})){try{await DB.put(id,{blob:dataURLToBlob(f.data),name:f.name,type:f.type})}catch(e){}}
  const incoming=o.cars.map(c=>{const n=norm({...c,id:uid()});if(!S.sample&&S.cars.some(x=>x.name===n.name&&x.plate===n.plate))n.name+='（匯入）';return n});
  if(S.sample){S.cars.forEach(dropCarFiles);S={cars:incoming,cur:incoming[0].id,sample:false,prefs:S.prefs}}
  else{S.cars.push(...incoming);S.cur=incoming[0].id}
  afterChange();toast(`已加入 ${incoming.length} 台車。`);
}
const sSeg=(key,opts,cur)=>opts.map(([v,l])=>`<button type="button" data-${key}="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('');
const sDots=()=>{const p=S.prefs||{};return Object.entries(ACCENTS).map(([k,v])=>`<button type="button" class="dot" data-accent="${k}" aria-label="${v[2]}" aria-pressed="${(p.accent||'blue')===k}" style="--dc:${v[0]}"></button>`).join('')};
function settingsHTML(){
  S.prefs=S.prefs||{};const p=S.prefs;const seg=sSeg,dots=sDots;
  return `<div class="settings">
    ${SYNC.html()||`<div><div class="group"><div class="cell acct">${ic('gray','user')}<div class="main"><span class="t">尚未登入</span><span class="s">資料目前只存在這台裝置</span></div></div>
      <div class="cell soon-row">${ic('gray','sync')}<div class="main"><span class="t">雲端同步與備份</span></div><span class="pill-soon">正式版</span></div></div>
      <p class="foot">會員帳號、雲端同步、車輛共享會在正式版推出。在那之前，請用下面的「備份全部資料」保存紀錄。</p></div>`}
    <div><p class="ghead">外觀</p><div class="group icons">
      <div class="cell frow">${ic('indigo','moon')}<span>佈景主題</span><div class="seg inrow w-theme" id="s-theme">${seg('theme',[['auto','自動'],['light','淺色'],['dark','深色']],p.theme||'auto')}</div></div>
      <div class="cell frow">${ic('red','paint')}<span>主題顏色</span><div class="dots" id="s-accent">${dots()}</div></div>
      <label class="cell frow">${ic('blue','globe')}<span>語言</span><select id="s-lang">${LANGS.map(([k,n])=>`<option value="${k}"${(p.lang||'auto')===k?' selected':''}${k==='auto'?'':' data-i18n-skip'}>${n}</option>`).join('')}</select></label>
    </div></div>
    <div><p class="ghead">記錄</p><div class="group icons">
      <label class="cell frow">${ic('orange','pump')}<div class="main"><span class="t">自動帶入牌價</span><span class="s">依日期、加油站和油品填入油價</span></div><input type="checkbox" class="switch" id="s-autoprice"${p.autoPrice===false?'':' checked'}></label>
    </div></div>
    <div><p class="ghead">資料</p><div class="group icons">
      <button type="button" class="cell" id="s-xlsx">${ic('green','table')}<div class="main"><span class="t">匯出為 Excel</span><span class="s">目前這台車；匯出的檔案也能再匯入</span></div>${chev}</button>
      <button type="button" class="cell" id="s-backup">${ic('blue','download')}<div class="main"><span class="t">備份全部資料</span><span class="s">含照片和車主手冊</span></div>${chev}</button>
      <label class="cell">${ic('teal','upload')}<div class="main"><span class="t">匯入資料</span><span class="s">車帳本的 Excel、備份檔或轉移檔，車輛會加進清單</span></div>${chev}<input type="file" id="s-import" accept=".json,.xlsx,.xlsm,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12" hidden></label>
      <button type="button" class="cell" id="loadSample">${ic('gray','car')}<div class="main"><span class="t">載入範例資料</span></div>${chev}</button>
    </div><p class="foot">紀錄和照片存在這台裝置的瀏覽器裡，清除瀏覽資料會遺失，建議定期備份。</p></div>
    ${delGroup('all','清除所有車輛和紀錄')}
    <p class="about">車帳本 1.0 原型・無廣告</p>
  </div>`;
}
function bindSettings(sc){
    const p=S.prefs,seg=sSeg,dots=sDots;
    const $=q=>sc.querySelector(q);
    const setPref=(k,v)=>{p[k]=v;save();applyPrefs();render()};
    $('#s-theme').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;setPref('theme',b.dataset.theme);$('#s-theme').innerHTML=seg('theme',[['auto','自動'],['light','淺色'],['dark','深色']],p.theme)});
    $('#s-autoprice').addEventListener('change',e=>{p.autoPrice=e.target.checked;save()});
    $('#s-lang').addEventListener('change',e=>{p.lang=e.target.value;save();L10N.set(p.lang);render()});
    $('#s-accent').addEventListener('click',e=>{const b=e.target.closest('[data-accent]');if(!b)return;setPref('accent',b.dataset.accent);$('#s-accent').innerHTML=dots()});
    $('#s-xlsx').addEventListener('click',()=>exportExcel(C()));
    $('#s-backup').addEventListener('click',()=>exportBackup(S.cars));
    $('#s-import').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;/\.xls[xm]$/i.test(f.name)?importExcel(f):importBackup(f)});
    armDelete(sc,()=>{DB.clear();const pr=S.prefs;S=blank();S.prefs=pr;afterChange()},'確定清除全部');
    $('#loadSample').addEventListener('click',()=>{S.cars.forEach(dropCarFiles);const pr=S.prefs;S=sampleData();S.prefs=pr;afterChange()});
    SYNC.bind(sc);
}

/* ---------- events ---------- */
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0)});
document.getElementById('btnCar').addEventListener('click',carSwitcher);
document.getElementById('btnAdd').addEventListener('click',addSheet);
view.addEventListener('click',e=>{
  const t=e.target.closest('[data-rem-rec],[data-act],[data-edit-fuel],[data-edit-charge],[data-edit-maint],[data-edit-exp],[data-edit-odo],[data-tab-go],[data-year],[data-sub]');if(!t)return;
  const d=t.dataset;
  if(d.year){year=+d.year;render();return}
  if(d.sub){sub=d.sub;render();return}
  if(d.tabGo){tab=d.tabGo;render();window.scrollTo(0,0);return}
  if(d.remRec)return maintSheet(d.remRec,d.remItem);
  if(d.editFuel)return fuelSheet(d.editFuel);
  if(d.editCharge)return fuelSheet(d.editCharge,null,true);
  if(d.editMaint)return maintSheet(d.editMaint);
  if(d.editExp)return expSheet(d.editExp);
  if(d.editOdo)return odoSheet(d.editOdo);
  if(d.act==='newOdo')return odoSheet();
  if(d.act==='carPhoto')return carSheet(S.cur,true);
  if(d.act==='meter')return meterSheet();
  if(d.act==='intervals')return intervalSheet();
  if(d.act==='clearSample'){S.cars.forEach(dropCarFiles);const pr=S.prefs;S=blank();S.prefs=pr;save();render()}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const v=document.querySelector('.viewer'),tp=[...document.querySelectorAll('.scrim.top')].pop();if(v)v.remove();else if(tp)tp.remove();else if(root.firstChild)close()});
let lastY=0;
function tabState(){const y=window.scrollY,t=document.querySelector('.tabs');if(!t)return;if(y>lastY+6&&y>80)t.classList.add('mini');else if(y<lastY-6||y<40)t.classList.remove('mini');lastY=y}
window.addEventListener('scroll',tabState,{passive:true});
document.querySelector('.tabs').addEventListener('click',()=>document.querySelector('.tabs').classList.remove('mini'));
function navState(){const nav=document.querySelector('.nav');if(!nav)return;
  const past=window.scrollY>40;nav.classList.toggle('scrolled',past);nav.classList.toggle('lifted',window.scrollY>2)}
window.addEventListener('scroll',navState,{passive:true});
applyPrefs();
L10N.set((S.prefs||{}).lang);L10N.watch();
render();
OIL.load();
SYNC.init();
})();
