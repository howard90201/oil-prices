name: 車型資料套用

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      file:
        description: '待確認清單，例如 vehicles/pending/2026-12-01.csv'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == '同意套用' && contains(github.event.issue.title, '車型資料待確認'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 找出清單並套用
        id: run
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          F="${{ github.event.inputs.file }}"
          if [ -z "$F" ]; then D=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}'); F="vehicles/pending/$D.csv"; fi
          python3 vehicles/scripts/apply.py "$F" | tee result.txt
      - name: 儲存
        run: |
          git config user.name "vehicle-bot"
          git config user.email "vehicle-bot@users.noreply.github.com"
          git add -A vehicles
          git commit -m "套用車型更新 $(TZ=Asia/Taipei date +%F)" && git push
      - name: 回報並關閉 issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "已套用：$(cat result.txt)。車帳本會在下次週一同步時換成新的車款資料。"
          gh issue close ${{ github.event.issue.number }}
