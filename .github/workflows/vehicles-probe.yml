name: 車型資料連線測試
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 vehicles/scripts/probe.py
      - name: 結果存到 probe 分支
        run: |
          git config user.name "vehicle-bot"; git config user.email "vehicle-bot@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rfq --cached . ; git add probe/
          git commit -qm "probe $(date -u +%FT%TZ)"
          git push -f origin probe
